{% load static hyper_tags %}
{% hyper_csp_nonce as hyper_nonce %}
<!DOCTYPE html>
<html lang="en">
    <head>
        {% block head %}
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>{{ title|default:"HyperDjango" }}</title>
        {% endblock head %}
        {% hyper_preloads %}
        {% hyper_stylesheets %}
        {% hyper_head_scripts %}
    </head>
    <body>
        <div id="hyper-csrf-token" hidden>{% csrf_token %}</div>
        {% block body %}
        {% endblock body %}
        <script src="{% static 'hyperdjango/hyper.js' %}"{% if hyper_nonce %} nonce="{{ hyper_nonce }}"{% endif %}></script>
        <script src="{% static 'hyperdjango/hyper-debug-toolbar.js' %}"{% if hyper_nonce %} nonce="{{ hyper_nonce }}"{% endif %}></script>
        <script src="{% static 'hyperdjango/hyper-alpine.js' %}"{% if hyper_nonce %} nonce="{{ hyper_nonce }}"{% endif %}></script>
        {% hyper_body_scripts %}
    </body>
</html>
